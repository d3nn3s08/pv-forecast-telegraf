# pv forecast data
  [[inputs.http]]
  urls = [
    "https://api.forecast.solar/estimate/:lat/:lon/:dec/:az/:kwp?time=utc"
  ]
# dec - plane declination, 0 (horizontal) … 90 (vertical) - always in relation to the earth's surface; integer
# az - plane azimuth, -180 … 180 (-180 = north, -90 = east, 0 = south, 90 = west, 180 = north); integer
# kwp - installed modules power in kilo watt
#
#  data_format = "json"
#  name_override = "pv_forecast_watt_hours_day"
#  interval = "8h"

  # JSON-Parsing
#  json_query = "result"
#  tag_keys = []
#  json_time_key = ""
#  json_time_format = ""

#  [inputs.http.tags]
#    influxdb_bucket = "pvforecast"
    headers = {"accept" = "text/csv", "X-Delimiter" = "|", "X-Separator" = ";"}
    data_format = "csv"
    name_override = "pv_forecast_watt_hours_day"
    interval = "8h"
    csv_header_row_count = 0
    csv_column_names = ["time","value"]
    csv_column_types = []
    csv_delimiter = ";"
    csv_timestamp_column = "time"
    csv_timezone = "Etc/UTC"
    csv_timestamp_format = "2006-01-02"
    [inputs.http.tags]
      influxdb_bucket = "pvforecast"
